<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><style>body{margin:0;background:#eef2f7;font-family:Segoe UI,Arial,sans-serif;color:#18212f}.box{max-width:430px;margin:10vh auto;background:#fff;border-radius:16px;padding:26px;box-shadow:0 4px 25px #17365d20}.top{text-align:center;color:#17365d}input{width:100%;padding:12px;border:1px solid #b9c5d2;border-radius:9px;font-size:16px;box-sizing:border-box;margin:12px 0}button{width:100%;padding:12px;border:0;border-radius:9px;background:#17365d;color:white;font-weight:700}.err{background:#fee2e2;color:#991b1b;padding:9px;border-radius:8px;margin-top:10px}.muted{color:#64748b;font-size:13px}</style></head><body><div class="box"><div class="top"><h2>{{ title }}</h2><p>{{ subtitle }}</p></div><form method="post"><label><strong>Clave</strong></label><input type="password" name="password" autofocus required><button>{{ button }}</button></form>{% if error %}<div class="err">{{ error }}</div>{% endif %}<p class="muted">Dr. Javier Vargas · Legislación Escolar de Formosa</p></div></body></html>
